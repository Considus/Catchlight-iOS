name: CI

# Task 6.17 — run the full test suite on every push to main and every PR
# targeting main. Two jobs run in parallel:
#
#   release-build — `xcodebuild build` in the Release configuration, a compile
#                   check for Release-only breaks.
#   xcode-tests   — `xcodebuild test` against the iOS simulator: the app unit
#                   tests in Tests/CatchlightAppTests plus the XCUITest bundle.
#
# CatchlightCore is a Swift package pulled from Considus/Catchlight-Core at the
# exact version pinned in project.yml. Its own suite (`swift test` + `coreverify`)
# runs in that repo's CI, not here.
#
# Both jobs must pass before this commit is mergeable — these are the status
# checks wired into branch protection in 6.18.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN, declared once at the top so it applies to
# every job (2026-09-12). Without this block the token inherits the repository
# default, which on an older repo can include WRITE across contents, issues,
# packages and more — handed to every third-party action in the run.
#
# Nothing in this workflow writes to the repo: the jobs check out, build and test.
# `contents: read` is therefore the whole requirement, and a future job that needs
# more should ask for it at the JOB level rather than widening this.
#
# Raised by an OpenSSF Scorecard "Token Permissions" score of 0. It is the one
# finding in that scan that describes a real exposure rather than a project-maturity
# metric — the supply-chain risk is not this repo's code but what a compromised
# action could do with an over-scoped token.
permissions:
  contents: read

# Cancel an in-flight run for the same branch / PR when a new commit arrives —
# saves runner minutes without losing the final-commit signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    # Compile check in the RELEASE configuration. `xcodebuild test` runs Debug
    # only, so a Release-only compile break (e.g. a symbol declared inside
    # `#if DEBUG` but used in shipping code — hit 2026-07-01 with
    # SettingsView.showNoticeHistory) kept all checks green while every
    # archive failed. A generic-simulator build needs no signing identities
    # and no simulator runtime boot, so this job is cheap.
    name: iOS (Release build)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Xcode 26 is REQUIRED, and the image default is NOT it (2026-08-15). The App
      # Intents declare `supportedModes` behind `@available(iOS 26.0, *)` ([[D-202]]),
      # and `IntentModes` does not exist in the iOS 18 SDK. Xcode 16.4, the macos-15
      # default, therefore cannot compile the app at all. This is a hard requirement of
      # the source, not a preference: PR #146 went red on exactly this.
      #
      # The step takes the HIGHEST installed Xcode 26 instead of one pinned version, so
      # an image bump inside 26.x does not break the build. If the image drops Xcode 26
      # completely, the step stops here with a clear message. Without it the build fails
      # later as "cannot find type 'IntentModes'", which reads like a code fault and is
      # not one.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image. The app needs the iOS 26 SDK (D-202)."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-spm-

      - name: xcodebuild build (Release)
        run: |
          xcodebuild build \
            -project Catchlight.xcodeproj \
            -scheme Catchlight \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator'

  xcode-tests:
    name: iOS (xcodebuild test)
    runs-on: macos-15
    strategy:
      # D-039 (2026-06-14): the deployment floor is iOS 18, so test the FLOOR
      # (iOS 18) and CURRENT (OS=latest) — the iOS 17 legs are dropped. fail-fast
      # off so a failure on one runtime still reports the other.
      fail-fast: false
      matrix:
        destination:
          # The floor leg just needs SOME iOS 18 runtime. The macos-15 image
          # dropped the exact 18.0 runtime (2026-06-15: now ships 18.5 / 18.6 +
          # 26.x), so this is pinned to the lowest available 18.x. Bump again if a
          # future image drops 18.5 too (check the "List available simulators" step).
          #
          # ⚠️ These matrix strings ARE the status-check names on branch protection
          # (e.g. "iOS (xcodebuild test) (platform=iOS Simulator,name=iPhone 16,
          # OS=18.5)"). Editing one renames its check, and the old name stays
          # required and never reports — which blocks every merge to main until
          # branch protection is updated to match. Change both together.
          - 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          - 'platform=iOS Simulator,name=iPhone 16,OS=latest'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Xcode 26 is REQUIRED, and the image default is NOT it (2026-08-15). The App
      # Intents declare `supportedModes` behind `@available(iOS 26.0, *)` ([[D-202]]),
      # and `IntentModes` does not exist in the iOS 18 SDK. Xcode 16.4, the macos-15
      # default, therefore cannot compile the app at all. This is a hard requirement of
      # the source, not a preference: PR #146 went red on exactly this.
      #
      # The step takes the HIGHEST installed Xcode 26 instead of one pinned version, so
      # an image bump inside 26.x does not break the build. If the image drops Xcode 26
      # completely, the step stops here with a clear message. Without it the build fails
      # later as "cannot find type 'IntentModes'", which reads like a code fault and is
      # not one.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 on this image. The app needs the iOS 26 SDK (D-202)."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE"

      - name: Install XcodeGen
        # XcodeGen is not pre-installed on the macos-15 image. Brew is fastest.
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Cache only the swiftpm download cache for the xcodebuild job: the
      # previous cache listed `.build` (which xcodebuild never touches) and a
      # `DerivedData/SourcePackages` path that doesn't exist (Xcode nests
      # SourcePackages under DerivedData/<Project>-<hash>/), so it restored
      # nothing while costing save/restore time.
      # The key hashes project.yml because that is where the CatchlightCore
      # version pin lives (Package.resolved is gitignored).
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-spm-

      - name: Disable simulator hardware keyboard
        # Guards against the classic XCUITest `typeText` flake on CI runners:
        # with the hardware keyboard connected the software keyboard never
        # appears and typing fails with kAXErrorCannotComplete (hit on run
        # 27280916290, Flow 5).
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: List available simulators (debug)
        # Surfaced in the run log so future failures pinning a destination are
        # easy to diagnose without re-running.
        run: xcrun simctl list devices available | grep -E "iPhone|iOS" | head -30

      - name: xcodebuild test
        # NOTE (2026-06-10): do NOT pass CODE_SIGNING_ALLOWED=NO. Simulator
        # builds use default AD-HOC signing, which needs no identities on the
        # runner but DOES embed the entitlements — with signing fully disabled
        # the app has no application-identifier and EVERY keychain operation
        # fails with errSecMissingEntitlement (-34018) on current runtimes,
        # taking the PIN/mnemonic keychain suites down with it.
        #
        # Destinations come from the matrix: the iOS 18 deployment floor (D-039)
        # and OS=latest. FileProtectionTests self-skips on simulator via XCTSkip.
        #
        # The Catchlight scheme's test action runs BOTH `CatchlightTests`
        # (unit tests — Tests/CatchlightAppTests) and
        # `CatchlightUITests` (XCUITest for the six core flows, the two-tap
        # regression anchor, and the block-editor / Angle flows — workplan 7.4 /
        # 7.5). The scheme is declared explicitly in project.yml because
        # XcodeGen's auto-scheme does NOT include the `bundle.ui-testing` target.
        #
        # NO RETRY (2026-10-01, ISSUE-006). `-retry-tests-on-failure -test-iterations 2` used to
        # rerun a failed UI test once. It carried a reproducible failure through at least three
        # merges behind a green check: `A11yStateUITests.testImportantButton_valueFlipsOnToggle`
        # failed the first attempt of every run because iOS's one-time "slide to type"
        # introduction covers the keyboard and the editor toolbar on a fresh simulator, and the
        # retry passed because iOS shows it once. The tests now dismiss it
        # (`dismissKeyboardIntroductionIfPresent` in UITestSupport), and a failure fails the check.
        run: |
          xcodebuild test \
            -project Catchlight.xcodeproj \
            -scheme Catchlight \
            -destination '${{ matrix.destination }}'
