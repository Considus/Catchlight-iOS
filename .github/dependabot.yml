version: 2
updates:
  # No "swift" ecosystem block. The one Swift package dependency, CatchlightCore,
  # is pinned with `exactVersion` in project.yml, and Dependabot's swift ecosystem
  # reads only Package.swift / Package.resolved. It does not parse XcodeGen specs
  # or .xcodeproj package references, and Package.resolved is gitignored, so a
  # swift block here would find nothing to track. Bump the Core pin by hand.
  #
  # The only versions Dependabot can track are the CI workflow's actions, which
  # are pinned to commit SHAs — this keeps those SHAs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
